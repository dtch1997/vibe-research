[project]
name = "loracle-v0"
version = "0.1.0"
description = "Minimal DIT repro: train an interpreter LoRA that identifies subject LoRA behaviors"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "peft",
    "datasets",
    "anthropic",
    "accelerate",
    "python-dotenv>=1.2.2",
    "matplotlib>=3.10.8",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
